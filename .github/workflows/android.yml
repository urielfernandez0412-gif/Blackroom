name: Android Export
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Descomprimir carpetas
         run: |
           unzip -o res.zip -d res
           rm res.zip
      
      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.6.3.stable
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Descargar plantillas export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          wget https://downloads.tuxfamily.org/godotengine/4.6.3/export/Godot_v4.6.3-stable_export_templates.tpz
          unzip Godot_v4.6.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.6.3.stable
      
      - name: Compilar APK Debug
        run: godot --headless --export-debug "Android" build/debug.apk
      
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: blackroom-debug
          path: build/debug.apk
